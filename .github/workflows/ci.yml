name: Simulation checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path rust-core/Cargo.toml --locked
      - run: npm run test:parity
      - run: npm run build:wasm && npm run test:wasm
      - uses: actions/upload-artifact@v4
        with:
          name: sim-orbit-wasm
          path: rust-core/target/wasm32-unknown-unknown/release/sim_orbit_core.wasm
          if-no-files-found: error
